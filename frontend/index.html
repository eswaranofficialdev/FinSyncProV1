<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- UPDATED: Viewport config for full-screen and notch support (viewport-fit=cover) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#4F46E5" />

    <title>FinSync Pro | Enterprise Finance Management</title>

    <!-- ========================================== -->
    <!-- PWA & FULL SCREEN META TAGS (iOS & Android) -->
    <!-- ========================================== -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinSync Pro" />
    
    <!-- Link to your PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icon (Make sure to put a 192x192 logo in your public folder) -->
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- ========================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Restore saved theme BEFORE React loads -->
    <script>
      (function () {
        const theme =
          localStorage.getItem('theme-mode') || 'light';

        const colorTheme =
          localStorage.getItem('color-theme') || 'indigo';

        document.documentElement.setAttribute(
          'data-theme',
          theme
        );

        document.documentElement.setAttribute(
          'data-color-theme',
          colorTheme
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
